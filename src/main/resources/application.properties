spring.application.name=webbuilder

spring.datasource.url=jdbc:postgresql://localhost:5432/webbuilder

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.expiration=86400000
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite

stitch.service.url=http://127.0.0.1:3001
stitch.internal.token=${STITCH_INTERNAL_TOKEN}
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=always
